server:
  port: 8082

spring:
  application:
    name: ms-rutaexpress-catalog
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:catalogdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual      # ACK explícito en los consumidores
        default-requeue-rejected: false
        prefetch: 10
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:TENANT_ID}/v2.0

# ---- Mensajería RabbitMQ: único lugar donde se definen nombres ----
app:
  messaging:
    exchange: rutaexpress.catalog.exchange
    dead-letter-exchange: rutaexpress.catalog.dlx
    max-retries: 3
    queues:
      audit: rutaexpress.catalog.audit.queue
    dead-letter-queues:
      audit: rutaexpress.catalog.audit.dlq
    routing-keys:
      item-created: catalog.item.created
      audit-binding: "catalog.#"
      audit-dead: audit.dead
