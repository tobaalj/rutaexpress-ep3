server:
  port: 8081

spring:
  application:
    name: ms-rutaexpress-shipments
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:shipmentsdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Reemplaza TENANT_ID por tu ID de inquilino de Azure AD
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:TENANT_ID}/v2.0

# ---- Mensajería RabbitMQ: único lugar donde se definen nombres ----
# Este servicio solo PRODUCE comandos; los consume ms-rutaexpress-notify (puerto 8084).
app:
  messaging:
    exchanges:
      direct: cmd.direct
      topic: cmd.topic
    routing-keys:
      email-send: email.send
      warehouse-ticket: warehouse.ticket
      label-gen: label.gen
    # Estados que disparan un email al remitente
    email-statuses:
      - ACEPTADO
      - EN_RUTA
      - ENTREGADO
